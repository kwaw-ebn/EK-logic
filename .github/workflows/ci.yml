name: Validate application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eklogic_test
          POSTGRES_USER: eklogic
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eklogic"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://eklogic:test-only@localhost:5432/eklogic_test
      TEST_DATABASE_URL: postgresql+psycopg://eklogic:test-only@localhost:5432/eklogic_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock pytest
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r backend/requirements.lock
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
